<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: white; }
      .node { fill: #0c4a6e; }
      .connection { stroke: #0c4a6e; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0c1e2e; }
      .node { fill: #0ea5e9; }
      .connection { stroke: #0ea5e9; }
    }
  </style>
  <g clip-path="url(#clip0)">
    <rect class="background" width="180" height="180" rx="37" />
    
    <!-- Connection lines -->
    <line x1="45" y1="45" x2="90" y2="90" class="connection" stroke-width="3" opacity="0.4"/>
    <line x1="135" y1="45" x2="90" y2="90" class="connection" stroke-width="3" opacity="0.4"/>
    <line x1="45" y1="135" x2="90" y2="90" class="connection" stroke-width="3" opacity="0.4"/>
    <line x1="135" y1="135" x2="90" y2="90" class="connection" stroke-width="3" opacity="0.4"/>
    <line x1="90" y1="30" x2="90" y2="90" class="connection" stroke-width="3" opacity="0.4"/>
    <line x1="90" y1="150" x2="90" y2="90" class="connection" stroke-width="3" opacity="0.4"/>
    <line x1="30" y1="90" x2="90" y2="90" class="connection" stroke-width="3" opacity="0.4"/>
    <line x1="150" y1="90" x2="90" y2="90" class="connection" stroke-width="3" opacity="0.4"/>
    
    <!-- Additional connection lines -->
    <line x1="45" y1="45" x2="90" y2="30" class="connection" stroke-width="2" opacity="0.3"/>
    <line x1="135" y1="45" x2="90" y2="30" class="connection" stroke-width="2" opacity="0.3"/>
    <line x1="45" y1="135" x2="30" y2="90" class="connection" stroke-width="2" opacity="0.3"/>
    <line x1="135" y1="135" x2="150" y2="90" class="connection" stroke-width="2" opacity="0.3"/>
    <line x1="45" y1="45" x2="30" y2="90" class="connection" stroke-width="2" opacity="0.3"/>
    <line x1="135" y1="45" x2="150" y2="90" class="connection" stroke-width="2" opacity="0.3"/>
    
    <!-- Neural network nodes -->
    <circle cx="45" cy="45" r="12" class="node" opacity="0.9"/>
    <circle cx="135" cy="45" r="12" class="node" opacity="0.9"/>
    <circle cx="45" cy="135" r="12" class="node" opacity="0.9"/>
    <circle cx="135" cy="135" r="12" class="node" opacity="0.9"/>
    <circle cx="90" cy="90" r="18" class="node"/>
    <circle cx="90" cy="30" r="10" class="node" opacity="0.8"/>
    <circle cx="90" cy="150" r="10" class="node" opacity="0.8"/>
    <circle cx="30" cy="90" r="10" class="node" opacity="0.8"/>
    <circle cx="150" cy="90" r="10" class="node" opacity="0.8"/>
  </g>
  <defs>
    <clipPath id="clip0">
      <rect width="180" height="180" fill="white" />
    </clipPath>
  </defs>
</svg>
